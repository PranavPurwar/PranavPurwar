cv:
  name: "Pranav Purwar"
  headline: "Systems Engineer | JVM Internals & Android Virtualization"
  location: "Delhi, India"
  email: "purwarpranav80@gmail.com"
  social_networks:
    - network: GitHub
      username: PranavPurwar
    - network: LinkedIn
      username: pranavpurwar
  

  sections:
    summary:
      - "**Systems Engineer** specializing in *JVM internals*, *compiler toolchains*, *AI infrastructure*, and *Android OS-level virtualization*. Creator of **Cosmic IDE** (**686+ stars**, **100+ forks**) featuring custom glibc runtime with recursive process wrapping, and **Bryte AI Platform** with *native FSRS v4 implementation* and *GraphRAG retrieval*. Core contributor to open-source platforms with **1.2M+ downloads** and **30k+ daily users**."

    experience:
      - name: "Bryte AI Platform (Open-Source) | Creator & Lead Developer"
        location: "[**GitHub**](https://github.com/Bryte-Edu/server)"
        start_date: "2024-09"
        highlights:
          - "Designed **Kotlin Multiplatform** backend infrastructure for multi-modal document ingestion (PDF/OCR via Mistral SDK, YouTube via open-source extractor, web scraping with recursive HTML cleaning and LLM-powered hierarchical reconstruction)."
          - "Implemented production-grade **GraphRAG** with Neo4j: **1024-dim vector index** with cosine similarity, weighted Cypher queries (configurable docBias/crossDocPenalty), automatic chunk interlinking with semantic thresholds (**≥0.65**), and real-time graph visualization endpoints."
          - "Engineered native Kotlin port of **FSRS v4** (spaced-repetition algorithm) with exact mathematical fidelity to upstream."
          - "Architected stateful AI agent orchestration using JetBrains Koog framework with autonomous history compression for **100k+ token context windows**, plus resilient MarkdownStreamingParser for real-time fragmented token processing with heuristic recovery for broken table structures."
          - "Built full-duplex WebSocket communication via kotlinx.rpc: multiplexed SessionService and FlashcardService over single connections with type-safe contracts, enabling **real-time streaming** of generated content to clients the millisecond they are parsed."


      - name: "Cosmic IDE | Creator & Architect"
        location: "[**GitHub**](https://github.com/Cosmic-IDE/Cosmic-IDE)"
        start_date: "2021-08"
        highlights:
          - "Architected full Linux OS environment on Android without root, proot, or containers using custom glibc runtime with **LD_PRELOAD shims** that intercept filesystem, DNS, and process execution calls."
          - "Designed **recursive process sandboxing**: execve/execvp/posix_spawn interception ensures all child processes inherit shim chain, preventing any process from escaping the sandbox."
          - "Engineered **native PTY implementation** with proper terminal emulation, foreground process group signal handling, and Ctrl+C propagation for interactive shells."
          - "Built plugin-based IDE architecture with **11 language plugins** (Rust, Java, Kotlin, Scala, Gradle, Maven, Go, Gleam, C/C++, Python, Lua) using dynamic loading and marketplace system."
          - "Implemented complete Arch Linux ARM runtime with **pacman integration**, fake root support, and automated glibc environment generation."
          - "Developed full-featured IDE with **real-time code analysis**, quick fixes, and LSP support across all plugins directly on mobile."

      - name: "OpenJDK & Kotlin Compiler Ports (Android)"
        location: "[**OpenJDK**](https://github.com/PranavPurwar/javac-android) | [**Kotlin Compiler**](https://github.com/PranavPurwar/kotlinc-android)"
        start_date: "2023-09"
        highlights:
          - "Ported javac (**OpenJDK 27 EA**) and kotlinc (**2.4+**) to Android Runtime (**ART)**, maintaining patches synced with upstream releases."
          - "Rewrote javac's internal platform resolution to bypass Android's restricted NIO by implementing **custom ZipFileSystem** for ct.sym, and patched classloading incompatibilities."
          - "Engineered memory reclamation layer using HiddenApiBypass to invoke Android's internal NioUtils.freeDirectBuffer, preventing **fatal OOM crashes** during memory-mapped JAR parsing."

      - name: "Official Kotlin Compiler Contribution (JetBrains/kotlin #5146)"
        location: "[**Pull Request**](https://github.com/JetBrains/kotlin/pull/5146)"
        date: "2023-11"
        highlights:
          - "Contributed to the official Kotlin compiler by resolving a **critical memory leak**, improving performance for fast JAR file system operations."

      - name: "Sketchware-Pro | Core Team & Technical Lead"
        location: "[**GitHub**](https://github.com/Sketchware-Pro/Sketchware-Pro)"
        start_date: "2021-08"
        highlights:
          - "Part of core team for the IDE (**1.6k+ stars**, **100k+ MAU**, **58+ contributors**) powered by the **ported Kotlin compiler**."
          - "Built build-system pipeline supporting Java 9/11 compilation; integrated **R8 Code Shrinker** reducing output **APK sizes by ~40%**."

      - name: "Reef (Digital Wellbeing & Productivity)"
        start_date: "2024-09"
        location: "[**Reef**](https://github.com/aload0/Reef)"
        highlights:
          - "Architected system-level digital wellbeing suite navigating strict Android background execution limits and battery optimization constraints to maintain reliable per-app tracking."
          - "Solved severe Android **OEM fragmentation** by engineering centralized UsageCalculator normalizing telemetry across diverse manufacturer implementations (MIUI, OneUI, etc.)."
          - "Implemented context-aware notification routing via Accessibility/Notification Listener services with complex time-boundary tracking for overnight routines."

    skills:
      - label: "Languages"
        details: "Kotlin, Java, Python, TypeScript, C, JVM Bytecode, DEX/ART"
      - label: "Compiler & Toolchain"
        details: "OpenJDK, Kotlin, ART, LSP, Gradle, R8/D8, Hidden API Bypass, ELF/PTY"
      - label: "Backend & AI Infrastructure"
        details: "Ktor, Neo4j (GraphRAG/Cypher), GraphRAG, FSRS v4, LLM Agents**, Koog Framework, Mistral/Cohere/Gemini APIs, SSE Streaming"
      - label: "Mobile & Platforms"
        details: "Android SDK, Jetpack Compose, Kotlin Multiplatform (KMP), Material You, F-Droid"
      - label: "Systems Programming"
        details: "glibc, Dynamic Linking, LD_PRELOAD, Process Virtualization, Custom Linkers, Recursive Sandboxing"

design:
  theme: classic
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.47in
    right_margin: 0.47in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.5em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 24pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.3em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: false
  links:
    underline: true
    show_external_link_icon: true
  header:
    alignment: center
    space_below_name: 0.4cm
    space_below_headline: 0.4cm
    space_below_connections: 0.4cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.4cm
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.3cm
    space_below: 0.58cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.5em
    space_between_text_based_entries: 0.2em
    show_time_spans_in:
      - experience
  entries:
    date_and_location_width: 3.2cm
    side_space: 0.15cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: true
    degree_width: 1cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0.1em
      space_between_bullet_and_text: 0.4em
  templates:
    footer: ''
    top_note: ''
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**, AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: '**DEGREE**'
      date_and_location_column: |-
        LOCATION
        DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
